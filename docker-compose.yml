services:
  db:
    image: postgres:17-alpine
    ports:
      - '5432:5432'

    env_file:
      .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data/
      
volumes:
  postgres_data: