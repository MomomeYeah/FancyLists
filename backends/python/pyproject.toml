[project]
name = "fancylists-backend"
version = "0.1.0"
description = "Django REST backend for FancyLists"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.18,<6",
    "djangorestframework>=3.15.2,<3.16",
    "dj-database-url>=2.2.0,<3",
    "dj-rest-auth[with-social]>=6.0.0,<7",
    "django-cors-headers>=4.5.0,<5",
    "psycopg2-binary>=2.9.13,<3",
    "python-dotenv>=1.2.4,<2",
    "social-auth-app-django>=5.4.2,<6",
    "social-auth-core>=4.5.4,<5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2.9,<6",
    "djangorestframework-stubs>=3.15.4,<3.16",
    "poethepoet",
    "pre-commit",
    "pytest",
    "pytest-django>=4.9.0",
    "ruff",
    "ty",
]

[tool.uv]
# This is an application, not an installable package
package = false

# --- Tasks ---------------------------------------------------------------
# Single entry points shared by humans, agents, pre-commit and CI.
# Run from this directory (backends/python), e.g. `uv run poe check`.

[tool.poe.tasks]
lint = { cmd = "ruff check", help = "Lint with Ruff" }
format-check = { cmd = "ruff format --check", help = "Check formatting with Ruff" }
typecheck = { cmd = "ty check", help = "Type check with ty" }
test = { cmd = "pytest", help = "Run backend tests (needs Postgres, e.g. `docker compose up -d`)" }

static = { sequence = ["lint", "format-check", "typecheck"], ignore_fail = "return_non_zero", help = "Lint, format check and type check (no database needed)" }
check = { sequence = ["lint", "format-check", "typecheck", "test"], ignore_fail = "return_non_zero", help = "Everything CI runs" }

fix = { sequence = [
    { cmd = "ruff check --fix" },
    { cmd = "ruff format" },
], ignore_fail = "return_non_zero", help = "Apply Ruff autofixes and formatting" }

migrate = { cmd = "python manage.py migrate", help = "Apply database migrations" }
serve = { cmd = "uvicorn lists.asgi:application --reload --port 8000", help = "Run the dev server locally" }

# --- Ruff ----------------------------------------------------------------

[tool.ruff]
line-length = 100
src = ["."]
extend-exclude = ["*/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "DJ",  # flake8-django
]

[tool.ruff.lint.per-file-ignores]
# Django settings modules layer on each other via star imports
"settings/*.py" = ["F403", "F405"]

# --- ty ------------------------------------------------------------------

[tool.ty.environment]
root = ["."]

[tool.ty.src]
exclude = ["*/migrations"]

[[tool.ty.overrides]]
# Django models and DRF serializers redefine the nested `class Meta` in every
# subclass by design; ty reports each one as an incompatible attribute override.
include = ["**/models.py", "**/serializers.py"]

[tool.ty.overrides.rules]
invalid-attribute-override = "ignore"

[tool.ty.terminal]
# Warnings shown in the editor must also fail CI
error-on-warning = true

# --- pytest --------------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
DJANGO_SETTINGS_MODULE = "settings.test"
