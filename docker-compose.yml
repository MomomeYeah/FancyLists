services:
  db:
    image: postgres:17-alpine
    ports:
      - '5432:5432'

    env_file:
      .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

    volumes:
      - postgres_data:/var/lib/postgresql/data/

  frontend:
    profiles:
      - full
    build:
      context: ./frontend
      dockerfile: Dockerfile

    environment:
      - PORT=${FRONTEND_PORT}
      - WATCHPACK_POLLING=true

    ports:
      - '${FRONTEND_PORT}:${FRONTEND_PORT}'

    volumes:
      - ./frontend:/app/frontend
      # node_modules gets its own volume, so local node_modules doesn't override
      - /app/frontend/node_modules

    depends_on:
      - backend

  backend: 
    profiles:
      - full
    build: 
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - .env
    environment:
      - POSTGRES_HOST=db

    ports:
      - '8000:8000'

    volumes:
      - ./backend:/app/backend

    depends_on:
      db:
        condition: service_healthy
        restart: true

volumes:
  postgres_data: